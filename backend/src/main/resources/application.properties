spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/landledger?serverTimezone=UTC}
spring.datasource.username=${DB_USER:landledger}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
registry.jwt-secret=${JWT_SECRET}
registry.bridge=${BRIDGE_URL:http://127.0.0.1:8546}
registry.admin-email=${ADMIN_EMAIL:}
registry.admin-password=${ADMIN_PASSWORD:}
spring.jackson.time-zone=UTC
